<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Checker</title>
<style>
  :root {
    --bg: #e4ddd3;
    --surface: #e9e3d8;
    --text: #3c352c;
    --text-dim: #7a7266;
    --accent: #c96f4a;
    --shadow-light: #ffffff;
    --shadow-dark: #c9c0b1;
    --panel-bg: #f2ede3;
  }

  [data-theme="dark"] {
    --bg: #2b2723;
    --surface: #302b26;
    --text: #ece5d8;
    --text-dim: #a89e8e;
    --accent: #e08a5f;
    --shadow-light: #3d372f;
    --shadow-dark: #1a1712;
    --panel-bg: #262220;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    transition: background 0.4s ease, color 0.4s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* --- Claymorphism toggle button --- */
  .toggle-btn {
    width: 60px;
    height: 60px;
    border-radius: 20px;
    border: none;
    background: var(--surface);
    box-shadow:
      8px 8px 16px var(--shadow-dark),
      -8px -8px 16px var(--shadow-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.2s ease, transform 0.2s ease, background 0.4s ease;
    color: var(--accent);
  }

  .toggle-btn:hover { transform: translateY(-2px); }

  .toggle-btn:active {
    box-shadow:
      inset 6px 6px 12px var(--shadow-dark),
      inset -6px -6px 12px var(--shadow-light);
  }

  .toggle-btn svg { width: 26px; height: 26px; }

  /* --- Upload zone --- */
  .upload-zone {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border-radius: 32px;
    box-shadow:
      12px 12px 24px var(--shadow-dark),
      -12px -12px 24px var(--shadow-light);
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: background 0.4s ease, box-shadow 0.2s ease;
    border: 2px dashed transparent;
  }

  .upload-zone.dragover {
    border-color: var(--accent);
  }

  .upload-icon-wrap {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 24px;
    background: var(--surface);
    box-shadow:
      inset 6px 6px 12px var(--shadow-dark),
      inset -6px -6px 12px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  .upload-icon-wrap svg { width: 36px; height: 36px; }

  .upload-zone p { margin: 4px 0; color: var(--text-dim); font-size: 0.95rem; }
  .upload-zone strong { color: var(--text); font-size: 1.1rem; }

  #fileInput { display: none; }

  /* --- Preview panels --- */
  .preview-wrap {
    width: 100%;
    max-width: 900px;
    margin-top: 32px;
    display: none;
  }

  .preview-wrap.active { display: block; }

  .preview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 700px) {
    .preview-grid { grid-template-columns: 1fr; }
  }

  .preview-panel {
    border-radius: 28px;
    padding: 24px;
    box-shadow:
      10px 10px 20px var(--shadow-dark),
      -10px -10px 20px var(--shadow-light);
    background: var(--surface);
  }

  .panel-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.light { background: #d9a86c; }
  .dot.dark { background: #6b6459; }

  .image-frame {
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    box-shadow:
      inset 4px 4px 10px rgba(0,0,0,0.12),
      inset -4px -4px 10px rgba(255,255,255,0.08);
  }

  .image-frame.light-bg { background: #f4f1ea; }
  .image-frame.dark-bg { background: #201d1a; }

  .image-frame img {
    max-width: 100%;
    max-height: 420px;
    display: block;
  }

  .clear-btn {
    display: block;
    margin: 28px auto 0;
    padding: 12px 28px;
    border: none;
    border-radius: 16px;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow:
      6px 6px 12px var(--shadow-dark),
      -6px -6px 12px var(--shadow-light);
    transition: box-shadow 0.2s ease, color 0.2s ease;
  }

  .clear-btn:hover { color: var(--accent); }

  .clear-btn:active {
    box-shadow:
      inset 4px 4px 8px var(--shadow-dark),
      inset -4px -4px 8px var(--shadow-light);
  }
</style>
</head>
<body>

  <header>
    <div>
      <h1>Image Checker</h1>
      <div class="subtitle">See how your image looks in light and dark mode</div>
    </div>
    <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <p><strong>Click to upload an image</strong></p>
    <p>or drag and drop it here</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="preview-grid">
      <div class="preview-panel">
        <div class="panel-label"><span class="dot light"></span> Light mode</div>
        <div class="image-frame light-bg">
          <img id="lightImg" src="" alt="Preview on light background">
        </div>
      </div>
      <div class="preview-panel">
        <div class="panel-label"><span class="dot dark"></span> Dark mode</div>
        <div class="image-frame dark-bg">
          <img id="darkImg" src="" alt="Preview on dark background">
        </div>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn">Remove image</button>
  </div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    themeIcon.innerHTML = theme === 'dark' ? sunPath : moonPath;
    localStorage.setItem('theme', theme);
  }

  const savedTheme = localStorage.getItem('theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(savedTheme);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(current);
  });

  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const previewWrap = document.getElementById('previewWrap');
  const lightImg = document.getElementById('lightImg');
  const darkImg = document.getElementById('darkImg');
  const clearBtn = document.getElementById('clearBtn');

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      lightImg.src = e.target.result;
      darkImg.src = e.target.result;
      previewWrap.classList.add('active');
      uploadZone.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  uploadZone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    handleFile(e.target.files[0]);
  });

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });

  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
  });

  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });

  clearBtn.addEventListener('click', () => {
    lightImg.src = '';
    darkImg.src = '';
    previewWrap.classList.remove('active');
    uploadZone.style.display = 'block';
    fileInput.value = '';
  });
</script>

</body>
</html>
